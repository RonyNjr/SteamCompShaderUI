name: Checks and Decky package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  decky:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npx --yes pnpm@9.15.9 install --frozen-lockfile
      - run: npx --yes pnpm@9.15.9 run typecheck
      - run: npx --yes pnpm@9.15.9 run build
      - run: npx --yes pnpm@9.15.9 test
      - run: npx --yes pnpm@9.15.9 run package
      - uses: actions/upload-artifact@v7
        with:
          name: steam-shaders-decky
          path: dist/steam-shaders-*.zip
          if-no-files-found: error

  release:
    # Publica somente tags de versão, depois que os testes e o pacote passaram.
    # Só este job recebe permissão de escrita; o build com dependências npm não.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [monitor, decky]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: steam-shaders-decky
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$TAG" != "v$version" ] || ! grep -qx "VERSION = \"$version\"" steam_shaders/support.py; then
            echo "Tag $TAG does not match package.json/support.py version $version" >&2
            exit 1
          fi
          python3 scripts/package_desktop.py
          # Nomes fixos para os links .../releases/latest/download/... usados na documentação.
          cp "dist/steam-shaders-$version.zip" dist/steam-shaders.zip
          cp "dist/steam-shaders-desktop-$version.tar.gz" dist/steam-shaders-desktop.tar.gz
          awk -v heading="## $version " 'index($0, heading) == 1 {found = 1; next}
                                         found && /^## / {exit} found' CHANGELOG.md > notes.md
          gh release create "$TAG" --verify-tag --title "Steam Shaders $version" --notes-file notes.md \
            "dist/steam-shaders-$version.zip" dist/steam-shaders.zip \
            "dist/steam-shaders-desktop-$version.tar.gz" dist/steam-shaders-desktop.tar.gz
